<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}OmniGate{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">OmniGate</a>
      <nav class="nav">
        <a href="/" class="{% if active_nav == 'overview' %}active{% endif %}">Overview</a>
        <a href="/dashboard/metrics" class="{% if active_nav == 'metrics' %}active{% endif %}">Metrics</a>
      </nav>
    </div>
    <span class="generated">Generated {{ generated_at.strftime("%Y-%m-%d %H:%M:%S UTC") }}</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
