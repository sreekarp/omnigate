[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnillm"
version = "0.1.0"
description = "Python client SDK for the OmniLLM (sync + async, streaming, typed)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OmniLLM" }]
keywords = ["llm", "gateway", "openai", "anthropic", "client", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/your-org/omnillm"

[tool.hatch.build.targets.wheel]
packages = ["src/omnillm"]

[tool.hatch.build]
artifacts = ["src/omnillm/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
