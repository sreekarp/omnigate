name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (server + SDK, editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e ./sdk

      - name: Server tests (offline; no DB/Redis needed)
        run: pytest -q

      - name: SDK tests
        run: pytest -q sdk/tests
